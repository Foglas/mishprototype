server:
  port: 8050
  tomcat:
    max-threads: 200

spring:
  application:
    name: mish

  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5200MB

  data:
    mongodb:
      auto-index-creation: true
      # Use the admin credentials from mongo/tls/docker-compose.yml and enable TLS.
      uri: ${MONGO_HOST:mongodb://admin:adminpassword@localhost:27017,localhost:27018,localhost:27019/mish-db?authSource=admin&replicaSet=replica-set-1&tls=true}
      connection-pool:
        max-size: 200
        min-size: 60
    redis:
      cluster:
        nodes:
          - redis-node-1:7221
          - redis-node-2:7222
          - redis-node-3:7223
          - redis-node-4:7224
          - redis-node-5:7225
          - redis-node-6:7226
          - redis-node-7:7227
          - redis-node-8:7228
          - redis-node-9:7229
        max-redirects: 3
      password: pass
      ssl:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          dev-client:
            client-id: dev-client
            client-secret: secret
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          dev-client:
            issuer-uri: ${KEYCLOAK_URL:http://mock-oidc:8080}/realms/${KEYCLOAK_REALM:mock-realm}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://mock-oidc:8080}/realms/${KEYCLOAK_REALM:mock-realm}


ldap:
  base: "dc=example,dc=com"
  url: "ldap://localhost:389"
  user-dn-pattern: "uid={0},ou=users"


origin:
  url: http://localhost:8081

app:
  page:
    limit: 20
    sort-direction: ASC
  security:
    role-claim-name: "realm_access.roles"
    role-claim-delimiter: "."
    email-claim: "email"
    user-id-claim: "sub"

logging:
  level:
    org:
      mongodb:
        driver: INFO
      springframework:
        security: DEBUG
        oauth2: DEBUG
        data:
          redis: DEBUG
          lettuce:
            core: DEBUG
