server:
  port: 8050

spring:
  application:
    name: mish

  servlet:
    multipart:
      enabled: true
      max-file-size: 5000MB
      max-request-size: 5200MB

  data:
    mongodb:
      auto-index-creation: true
      # Use the admin credentials from mongo/tls/docker-compose.yml and enable TLS.
      uri: ${MONGO_HOST:mongodb://admin:adminpassword@localhost:27017/admin?authSource=admin&tls=true}

  security:
    oauth2:
      client:
        registration:
          dev-client:
            client-id: dev-client
            client-secret: secret
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          dev-client:
            issuer-uri: ${KEYCLOAK_URL:http://mock-oidc:8080}/realms/${KEYCLOAK_REALM:mock-realm}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://mock-oidc:8080}/realms/${KEYCLOAK_REALM:mock-realm}


ldap:
  base: "dc=example,dc=com"
  url: "ldap://localhost:389"
  user-dn-pattern: "uid={0},ou=users"


origin:
  url: http://localhost:8081

app:
  page:
    limit: 20
    sort-direction: ASC
  security:
    role-claim-name: "realm_access.roles"
    role-claim-delimiter: "."
    email-claim: "email"
    user-id-claim: "sub"

logging:
  level:
    org:
      mongodb:
        driver: DEBUG
      springframework:
        security: DEBUG
        oauth2: DEBUG
