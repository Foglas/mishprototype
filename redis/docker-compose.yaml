      - ./certs-node-2/server.crt:/etc/redis/certs/server.crt:ro
      - ./certs-node-2/server.key:/etc/redis/certs/server.key:ro
      - ./certs-node-2/ca.pem:/etc/redis/certs/ca.pem:ro
    command: ["/tmp/redis/genConfig.sh", "nodes-2.conf", "redis-node-2", "7222"]
    
