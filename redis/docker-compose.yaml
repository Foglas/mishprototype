    volumes:
      - ./node9/data:/data
      - ./scripts:/tmp/redis
      - ./certs-node-9/server.crt:/etc/redis/certs/server.crt:ro
      - ./certs-node-9/server.key:/etc/redis/certs/server.key:ro
      - ./certs-node-9/ca.pem:/etc/redis/certs/ca.pem:ro
    command: ["/tmp/redis/genConfig.sh", "nodes-9.conf", "redis-node-9", "7229"]
    

  redis-cluster-creator:
      image: redis:latest
      container_name: redis-cluster-creator
      networks:
        - mish_net
      volumes:
        - ./certs-node-9/server.crt:/etc/redis/certs/server.crt:ro
        - ./certs-node-9/server.key:/etc/redis/certs/server.key:ro
        - ./certs-node-9/ca.pem:/etc/redis/certs/ca.pem:ro
      command: /bin/sh -c "redis-cli --tls --cacert /etc/redis/certs/ca.pem --user $REDIS_ADMIN_USER -a $REDIS_ADMIN_PASS --cluster create redis-node-1:7221 redis-node-2:7222 redis-node-3:7223 redis-node-4:7224 redis-node-5:7225 redis-node-6:7226 redis-node-7:7227 redis-node-8:7228 redis-node-9:7229 --cluster-replicas 2 --cluster-yes"
      depends_on:
        - redis-node-1
        - redis-node-2
        - redis-node-3
        - redis-node-4
        - redis-node-5
        - redis-node-6
        - redis-node-7
        - redis-node-8
        - redis-node-9


  redis-insight:
    container_name: redis-insight
    image: redislabs/redisinsight:1.14.0
    networks:
      - mish_net
    ports:
      - 8001:8001