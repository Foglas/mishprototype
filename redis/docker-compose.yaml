version: "3.8"

networks:
  mish_net:
    external: true

services:
  redis-node-1:
    image: redis/redis-stack:latest
    container_name: redis-node-1
    restart: always
    ports:
      - "7221:7221"
    networks:
      - mish_net
    volumes:
      - ./node1/data:/data
      - ./scripts:/tmp/redis
      - ./certs-node-1/server.crt:/etc/redis/certs/server.crt:ro
      - ./certs-node-1/server.key:/etc/redis/certs/server.key:ro
      - ./certs-node-1/ca.pem:/etc/redis/certs/ca.pem:ro
    command: ["/tmp/redis/genConfig.sh", "nodes-1.conf", "redis-node-1", "7221"]
    
  redis-node-2:
    image: redis/redis-stack:latest
    container_name: redis-node-2
    restart: always
