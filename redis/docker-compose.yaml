version: "3.8"

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.1.0/24

services:
  redis-node-1:
    image: redis/redis-stack:latest
    container_name: redis-node-1
    restart: always
    networks:
      redis-cluster-net:
        ipv4_address: 10.42.1.10
    volumes:
      - ./node1/data:/data
      - ./scripts/startup:/tmp/redis
    command: ["/tmp/redis/genConfig.sh", "nodes-1.conf", "10.42.1.10", "7222"]
    
  redis-node-2:
    image: redis/redis-stack:latest
    container_name: redis-node-2
