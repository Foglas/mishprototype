version: "3.8"

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.1.0/24

services:
  redis-node-1:
    image: redis/redis-stack:latest
    container_name: redis-node-1
    restart: always
    networks:
      redis-cluster-net:
        ipv4_address: 10.42.1.10
    volumes:
      - ./node1/data:/data
      - ./scripts:/tmp/redis
      - ./certs-node-1/server.crt:/etc/redis/certs/server.crt:ro
      - ./certs-node-1/server.key:/etc/redis/certs/server.key:ro
      - ./certs-node-1/ca.pem:/etc/redis/certs/ca.pem:ro
    command: ["/tmp/redis/genConfig.sh", "nodes-1.conf", "redis-node-1", "7222"]
    
  redis-node-2:
    image: redis/redis-stack:latest
    container_name: redis-node-2
