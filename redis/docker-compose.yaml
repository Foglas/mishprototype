    command: ["/tmp/redis/genConfig.sh", "nodes-9.conf", "10.42.1.18", "7222"]      
    

  redis-cluster-creator:
      image: redis:latest
      container_name: redis-cluster-creator
      networks:
        redis-cluster-net:
          ipv4_address: 10.42.1.5
      command: /bin/sh -c "redis-cli --user admin -a 'pass' --cluster create redis-node-1:7222 redis-node-2:7222 redis-node-3:7222 redis-node-4:7222 redis-node-5:7222 redis-node-6:7222 redis-node-7:7222 redis-node-8:7222 redis-node-9:7222 --cluster-replicas 2 --cluster-yes && sleep 50"
      depends_on:
        - redis-node-1
        - redis-node-2
        - redis-node-3
        - redis-node-4
        - redis-node-5
        - redis-node-6
        - redis-node-7
        - redis-node-8
        - redis-node-9


  redis-insight:
    container_name: redis-insight
    image: redislabs/redisinsight:1.14.0
    networks:
      redis-cluster-net:
        ipv4_address: 10.42.1.2
    ports:
      - 8001:8001