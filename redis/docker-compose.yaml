  redis-cluster-creator:
      image: redis:latest
      container_name: redis-cluster-creator
      networks:
        redis-cluster-net:
          ipv4_address: 10.42.1.5
      volumes:
        - ./certs-node-9/server.crt:/etc/redis/certs/server.crt:ro
        - ./certs-node-9/server.key:/etc/redis/certs/server.key:ro
        - ./certs-node-9/ca.pem:/etc/redis/certs/ca.pem:ro
      command: /bin/sh -c "redis-cli --tls --cacert /etc/redis/certs/ca.pem --user admin -a pass --cluster create redis-node-1:7222 redis-node-2:7222 redis-node-3:7222 redis-node-4:7222 redis-node-5:7222 redis-node-6:7222 redis-node-7:7222 redis-node-8:7222 redis-node-9:7222 --cluster-replicas 2 --cluster-yes"
      depends_on:
        - redis-node-1
        - redis-node-2
        - redis-node-3
        - redis-node-4
        - redis-node-5
        - redis-node-6
        - redis-node-7
        - redis-node-8
        - redis-node-9


  redis-insight:
    container_name: redis-insight
    image: redislabs/redisinsight:1.14.0
    networks:
      redis-cluster-net:
        ipv4_address: 10.42.1.2
    ports:
      - 8001:8001