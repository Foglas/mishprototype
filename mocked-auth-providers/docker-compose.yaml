version: "3.9"

services:

  # --- Mock LDAP ---
  ldap:
    image: osixia/openldap:1.5.0
    container_name: mock-ldap
    environment:
      LDAP_ORGANISATION: "Example"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ./ldap/bootstrap/run/startup.sh:/container/run/startup.sh:ro
      - ./ldap/bootstrap/ldif-to-copy:/tmp/ldif-to-copy:ro
    command: /container/run/startup.sh


  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data


  # --- Mock OIDC (Keycloak) ---
  mock-oidc:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: mock-oidc
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_URL_HOST: keycloak-db
      KC_DB: postgres
    command: start-dev --hostname=localhost --import-realm
    volumes:
      - ./oidc/realms:/opt/keycloak/data/import
    ports:
      - "8080:8080"

volumes:
  ldap-custom:
  keycloak-db-data:
