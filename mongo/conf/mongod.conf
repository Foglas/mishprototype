# MongoDB configuration for TLS and authorization
storage:
  dbPath: /data/db
  journal:
    enabled: true
systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true

net:
  port: 27017
  bindIpAll: true
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/ssl/mongo/mongo.pem
    CAFile: /etc/ssl/mongo/ca.pem
    allowConnectionsWithoutCertificates: true

replication:
  replSetName: "replica-set-1"
security:
  clusterAuthMode: x509

security:
  authorization: enabled
  # Uncomment and mount a keyfile if you need internal cluster auth
  # keyFile: /etc/ssl/mongo/keyfile
processManagement:
  fork: false

